<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>TournaLink / WASP3D Fullscreen Esports Leaderboard Overlay</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      color: #fff;
    }

    /* Esports Broadcast Frame */
    .broadcast-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 100px;
      background: radial-gradient(circle at center, rgba(13, 17, 23, 0.94) 0%, rgba(5, 7, 10, 0.98) 100%);
      border: 4px solid #00E676;
      box-shadow: inset 0 0 100px rgba(0, 230, 118, 0.2), 0 0 60px rgba(0,0,0,0.9);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Top Broadcast Header */
    .overlay-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 24px;
      margin-bottom: 30px;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .game-logo-pill {
      background: linear-gradient(135deg, #FF6B00, #FF0055);
      color: #fff;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 1.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
    }
    .tourney-title-text {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #f0f6fc;
      text-transform: uppercase;
    }
    .live-badge-glow {
      background: #e11d48;
      color: #fff;
      font-weight: 900;
      font-size: 1.3rem;
      padding: 8px 24px;
      border-radius: 6px;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 25px rgba(225, 29, 72, 0.7);
    }
    .live-dot {
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    /* Points Table */
    .table-container {
      width: 100%;
      flex: 1;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background: rgba(0, 230, 118, 0.15);
      color: #00E676;
      font-size: 1.25rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 16px 20px;
      border-bottom: 2px solid #00E676;
    }
    td {
      padding: 16px 20px;
      font-size: 1.35rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    tr:hover { background: rgba(0, 230, 118, 0.08); }

    .rank-cell {
      font-weight: 900;
      font-size: 1.5rem;
      width: 90px;
      text-align: center;
    }
    .rank-1 { color: #facc15; text-shadow: 0 0 15px rgba(250, 204, 21, 0.6); }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #f97316; }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 1.45rem;
      font-weight: 800;
    }
    .pts-badge {
      background: rgba(0, 230, 118, 0.2);
      color: #00E676;
      padding: 6px 18px;
      border-radius: 6px;
      font-size: 1.4rem;
      font-weight: 900;
      display: inline-block;
      min-width: 80px;
      text-align: center;
    }

    /* Footer Stats & Sponsors */
    .overlay-footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 2px solid rgba(255, 255, 255, 0.1);
      margin-top: 15px;
      font-size: 1.15rem;
      color: #8b949e;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="broadcast-container" id="broadcastRoot">
    <div class="overlay-header">
      <div class="brand-group">
        <span class="game-logo-pill" id="gameTag">PUBG MOBILE</span>
        <span class="tourney-title-text" id="tourneyTitle">OVERALL STANDINGS & POINTS TABLE</span>
      </div>
      <div class="live-badge-glow">
        <span class="live-dot"></span>
        <span>LIVE STATS</span>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="text-align: center; width: 90px;">RANK</th>
            <th>TEAM / SQUAD</th>
            <th style="text-align: center; width: 140px;">MATCHES</th>
            <th style="text-align: center; width: 160px;">WWCD / WINS</th>
            <th style="text-align: center; width: 160px;">FINISH PTS</th>
            <th style="text-align: center; width: 180px;">TOTAL POINTS</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <!-- Dynamic Leaderboard Data -->
        </tbody>
      </table>
    </div>

    <div class="overlay-footer">
      <span>Official International Scoring Standards (BGMI / PMGC Points Distribution)</span>
      <span id="footerMatchCount">Live Production via TournaLink & WASP3D Suite</span>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tourneyId = urlParams.get('tourneyId') || '';

    async function updateOverlayData() {
      try {
        const res = await fetch(`/api/overlay/data?tourneyId=${encodeURIComponent(tourneyId)}`);
        const data = await res.json();
        if (!data.success) return;

        const tourney = data.tournament || {};
        document.getElementById('gameTag').innerText = (tourney.game || 'ESPORTS').toUpperCase();
        document.getElementById('tourneyTitle').innerText = `${tourney.title || 'TOURNAMENT'} — LEADERBOARD`;

        const standings = data.standings || [];
        const tbody = document.getElementById('leaderboardBody');

        if (standings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 60px; color: #8b949e;">Awaiting tournament matches to be scored.</td></tr>';
          return;
        }

        tbody.innerHTML = standings.slice(0, 10).map((row, idx) => {
          const rank = idx + 1;
          const rankClass = rank === 1 ? 'rank-1' : (rank === 2 ? 'rank-2' : (rank === 3 ? 'rank-3' : ''));
          return `
            <tr>
              <td class="rank-cell ${rankClass}">#${rank}</td>
              <td>
                <div class="team-cell">
                  <span>${escapeHtml(row.teamName)}</span>
                </div>
              </td>
              <td style="text-align: center;">${row.matchesPlayed || 1}</td>
              <td style="text-align: center; color: #facc15;">${row.wins || 0}</td>
              <td style="text-align: center; color: #38bdf8;">${row.kills || 0}</td>
              <td style="text-align: center;"><span class="pts-badge">${row.totalPoints || 0} PTS</span></td>
            </tr>
          `;
        }).join('');

        document.getElementById('footerMatchCount').innerText = `${data.matchesLogged || 0} Matches Logged • Live OBS Feed`;
      } catch (err) {
        console.error('Error updating overlay:', err);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateOverlayData();
      setInterval(updateOverlayData, 3000); // Poll every 3 seconds for broadcast sync
    });
  </script>
</body>
</html>
